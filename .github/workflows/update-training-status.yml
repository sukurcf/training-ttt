name: Update training status

on:
  issue_comment:
    types: [created, edited]

permissions:
  contents: write
  issues: read

concurrency:
  group: training-status-csv
  cancel-in-progress: false

jobs:
  update-csv:
    # Do not treat pull-request review comments as training updates.
    if: github.event.issue.pull_request == null
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tracker
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Apply status comment
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: python scripts/update_status.py --comment "$COMMENT_BODY"

      - name: Commit and push CSV changes
        run: |
          if git diff --quiet -- data/training.csv; then
            echo "No CSV changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/training.csv
          git commit -m "chore: update training status"
          git push
